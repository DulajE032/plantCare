version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: plantcare_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plantcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: plantcare_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/plantcare
      - FRONTEND_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/media:/app/media

  frontend:
    build: ./plant-disease-frontend
    container_name: plantcare_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
